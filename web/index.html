<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto Data Engineering Dashboard</title>
  <style>
    :root {
      --bg: #1A1E1D;
      --card: #212726;
      --accent: #1E4039;
      --text: #E8F0EE;
      --muted: #9FB3AF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 { margin: 0; font-size: 24px; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .card h2 { margin-top: 0; font-size: 18px; }
    .accent-button {
      background: var(--accent);
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Crypto Data Engineering</h1>
    <p class="muted">Theme: dark teal inspired dashboard</p>
  </header>
  <main>
    <section class="card">
      <h2>Pipeline Status</h2>
      <p class="muted">Postgres, Kafka, Dagster, Binance consumer, Pathway</p>
      <button class="accent-button">Refresh Status</button>
    </section>
    <section class="card">
      <h2>OHLCV Freshness</h2>
      <p class="muted">Latest candle age and row counts</p>
    </section>
    <section class="card">
      <h2>Alerts</h2>
      <p class="muted">Green when all checks pass</p>
    </section>
  </main>
</body>
</html>
