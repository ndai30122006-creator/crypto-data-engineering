name: crypto-data-engineering

services:
  postgres:
    image: postgres:16
    container_name: crypto-postgres
    environment:
      POSTGRES_DB: crypto_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crypto_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: crypto-dagster-code
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m dagster_project.definitions
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://admin:secret@postgres:5432/crypto_db
      DAGSTER_ENVIRONMENT: local
    volumes:
      - ./dagster_project:/opt/dagster/dagster_project
      - ./config:/opt/dagster/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: crypto-dagster-webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml:ro
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: crypto-dagster-daemon
    command: dagster-daemon run -w /opt/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml:ro
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_started

volumes:
  pgdata:
  dagster_home:
