name: crypto-data-engineering

services:
  postgres:
    image: postgres:16
    container_name: crypto-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-crypto_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: crypto-dagster-code
    command: dagster code-server start -h 0.0.0.0 -p 4000 -m dagster_project.definitions
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-crypto_db}
      DAGSTER_ENVIRONMENT: local
    volumes:
      - ./dagster_project:/opt/dagster/dagster_project
      - ./config:/opt/dagster/config:ro
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 4000), timeout=5).close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: crypto-dagster-webserver
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w /opt/dagster/workspace.yaml
    ports:
      - "3000:3000"
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml:ro
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: crypto-dagster-daemon
    command: dagster-daemon run -w /opt/dagster/workspace.yaml
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
    volumes:
      - ./workspace.yaml:/opt/dagster/workspace.yaml:ro
      - dagster_home:/opt/dagster/dagster_home
    depends_on:
      postgres:
        condition: service_healthy
      dagster-code:
        condition: service_healthy
    healthcheck:
      # Kiểm tra process daemon thật qua /proc (stdlib, không cần psutil):
      # daemon chết mà instance vẫn load được thì check này đỏ.
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if any('dagster-daemon' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Kafka single-broker + replication factor 1: CHỦ Ý cho local learning
  # (nhẹ, đủ demo realtime). KHÔNG dựng 3 broker lúc này.
  # Muốn prod-like: 3 broker KRaft + RF=3 (offsets/transactions/topics),
  # min ISR=2, producer acks=all đã sẵn trong consumer.
  kafka:
    image: apache/kafka:3.9.0
    container_name: crypto-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 8d2f8b0e-9c1a-4b5e-8f2a-7c3d9e1f5a6b
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  binance-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    container_name: crypto-binance-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto.trades
      SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT
      HEARTBEAT_FILE: /tmp/binance-consumer.heartbeat
    volumes:
      - ./ingestion:/opt/consumer/ingestion
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # File nhịp tim do consumer touch mỗi khi publish (tối đa 10s/lần).
      # Treo process hoặc WS chết → file cũ hơn 120s → unhealthy.
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p='/tmp/binance-consumer.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Cho flush(15s) kịp chạy trước SIGKILL khi docker stop.
    stop_grace_period: 30s
    restart: unless-stopped

  pathway:
    build:
      context: .
      dockerfile: Dockerfile.pathway
    container_name: crypto-pathway
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto.trades
      KAFKA_GROUP_ID: pathway-ohlcv-1m
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-crypto_db}
      PGUSER: ${POSTGRES_USER:-admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - ./streaming:/opt/streaming/streaming
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # Pathway không mở port: kiểm tra process engine thật qua /proc.
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if any('pathway_pipeline' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
  dagster_home:
  kafka_data:
