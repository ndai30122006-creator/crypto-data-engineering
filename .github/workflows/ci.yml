name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check dagster_project ingestion streaming scripts tests
      - name: Pytest (offline, integration tự skip)
        run: uv run pytest tests/ -q
