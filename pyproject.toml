[project]
name = "crypto-data-engineering"
version = "0.1.0"
description = "Mini real-time Crypto Data Platform: RSS news + CoinGecko snapshot, Dagster + Postgres"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.10,<2",
    "dagster-webserver>=1.10,<2",
    "feedparser",
    "httpx",
    "psycopg2-binary",
    "pydantic>=2",
    "python-dateutil",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster_project"]
